<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colors - Dark Theme */
    --bg-primary: #121212;
    --bg-secondary: #1f1f1f;
    --bg-tertiary: #333333;
    --bg-gradient-dark: linear-gradient(145deg, #1e1e1e, #333333);
    --bg-input: #2c2c2c;
    /* Text Colors - Dark Theme */
    --text-primary: #fff;
    --text-secondary: #ddd;
    --text-tertiary: #b0bec5;
    --text-muted: rgb(230, 230, 230);
    /* Accent Colors */
    --accent-primary: #ffc107;
    --accent-hover: #e0a800;
    --accent-focus: #ffd54f;
    --accent-button-text: black;
    /* Shadow Colors */
    --shadow-dark: rgba(0, 0, 0, 0.5);
    --shadow-medium: rgba(0, 0, 0, 0.6);
    --shadow-light: rgba(0, 0, 0, 0.4);
    /* Spacing Values */
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --spacing-lg: 16px;
    --spacing-xl: 20px;
    --spacing-xxl: 25px;
    --spacing-xxxl: 30px;
    /* Border Radius */
    --radius-sm: 5px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-xl: 12px;
    --radius-full: 50%;
    /* Font Sizes */
    --font-sm: 0.9rem;
    --font-base: 1rem;
    --font-md: 1.1rem;
    --font-lg: 1.2rem;
    --font-xl: 1.6rem;
    --font-xxl: 1.7rem;
    --font-xxxl: 1.8rem;
    --font-icon-sm: 1.2rem;
    /* Transitions */
    --transition-fast: 0.2s ease;
    --transition-base: 0.3s ease;
    --transition-slow: 0.4s all;
  }
  /* Light theme overrides */
  body.light-theme {
    --bg-primary: #ffffff;
    --bg-secondary: rgb(253, 253, 253);
    --bg-tertiary: rgb(240, 240, 240);
    --bg-gradient-dark: linear-gradient(145deg, #ffffff, #f0f0f0);
    --bg-input: #ffffff;
    --text-primary: #333;
    --text-secondary: rgb(50, 50, 50);
    --text-tertiary: rgb(80, 80, 80);
    --text-muted: #333;
    --accent-button-text: rgb(30, 30, 30);
    --shadow-dark: rgba(0, 0, 0, 0.1);
    --shadow-medium: rgba(0, 0, 0, 0.1);
    --shadow-light: rgba(0, 0, 0, 0.1);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    max-height: 9999999px;
    font-family: 'Roboto', sans-serif;
    transition: var(--transition-base) all;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
  }
  button { cursor: pointer; font: inherit; color: inherit; background: none; border: none; }
  input { font: inherit; color: inherit; }

  /* ====== Flashcards page ====== */

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-md);
    gap: var(--spacing-md);
  }

  /* Topic chips */
  .chips {
    display: flex;
    gap: var(--spacing-sm);
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
    display: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: var(--spacing-xs) var(--spacing-md);
    border-radius: var(--radius-full);
    background: var(--bg-secondary);
    color: var(--text-tertiary);
    font-size: var(--font-sm);
    font-weight: 500;
    border: 1px solid transparent;
    box-shadow: 0 2px 6px var(--shadow-light);
    white-space: nowrap;
  }
  .chip svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .chip.active {
    background: var(--accent-primary);
    color: var(--accent-button-text);
    transform: translateY(-1px) scale(1.03);
    box-shadow: 0 3px 10px var(--shadow-medium);
  }
  .chip:active { transform: scale(0.96); }

  /* Stage */
  .stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .deck-shadow-card {
    position: absolute;
    width: min(86vw, 380px);
    aspect-ratio: 16 / 11;
    border-radius: var(--radius-xl);
    background: var(--bg-tertiary);
    box-shadow: 0 6px 18px var(--shadow-medium);
  }
  .deck-shadow-card.ds-1 { transform: translateY(10px) rotate(-6deg); opacity: 0.55; }
  .deck-shadow-card.ds-2 { transform: translateY(16px) rotate(6deg); opacity: 0.35; }
  @keyframes deckBob {
    0%, 100% { transform: translateY(10px) rotate(-6deg); }
    50% { transform: translateY(6px) rotate(-6deg); }
  }
  @keyframes deckBob2 {
    0%, 100% { transform: translateY(16px) rotate(6deg); }
    50% { transform: translateY(12px) rotate(6deg); }
  }
  .deck-shadow-card.ds-1 { animation: deckBob 3.2s ease-in-out infinite; }
  .deck-shadow-card.ds-2 { animation: deckBob2 3.6s ease-in-out infinite; }

  .card-perspective {
    position: relative;
    width: min(86vw, 380px);
    aspect-ratio: 16 / 11;
    perspective: 1400px;
    z-index: 2;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    animation: cardIn 0.45s cubic-bezier(.22,1.4,.45,1);
  }
  @keyframes cardIn {
    0% { transform: scale(0.85) translateY(14px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .card.sliding-left { animation: slideOutLeft 0.22s ease forwards; }
  .card.sliding-right { animation: slideOutRight 0.22s ease forwards; }
  @keyframes slideOutLeft { to { transform: translateX(-60px) rotate(-8deg); opacity: 0; } }
  @keyframes slideOutRight { to { transform: translateX(60px) rotate(8deg); opacity: 0; } }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.45,.05,.15,1.2);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius-xl);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--spacing-xl);
    box-shadow: 0 10px 26px var(--shadow-dark);
  }
  .card-front {
    background: var(--bg-gradient-dark);
    border: 1.5px solid var(--bg-tertiary);
  }
  .card-back {
    background: var(--accent-primary);
    color: var(--accent-button-text);
    transform: rotateY(180deg);
  }

  .card-topic-tag {
    position: absolute;
    top: var(--spacing-md);
    left: var(--spacing-md);
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    opacity: 0.8;
    display: none;
  }
  .card-back .card-topic-tag { color: var(--accent-button-text); opacity: 0.65; }
  .card-topic-tag svg { width: 13px; height: 13px; }

  .card-icon {
    width: 34px;
    height: 34px;
    margin-bottom: var(--spacing-sm);
    opacity: 0.85;
  }
  .card-front .card-icon { color: var(--accent-primary); }
  .card-back .card-icon { color: var(--accent-button-text); }

  .card-text {
    font-size: var(--font-lg);
    font-weight: 700;
    line-height: 1.35;
  }
  .card-front .card-text { color: var(--text-primary); }
  .card-back .card-text { font-size: var(--font-md); font-weight: 500; color: var(--accent-button-text); }

  .flip-hint {
    position: absolute;
    bottom: var(--spacing-md);
    font-size: 0.68rem;
    color: var(--text-tertiary);
    opacity: 0.7;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-back .flip-hint { color: var(--accent-button-text); opacity: 0.55; }
  .flip-hint svg { width: 12px; height: 12px; animation: spin 2.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* sparkle burst on flip */
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-primary);
    pointer-events: none;
    z-index: 5;
    animation: sparkOut 0.6s ease-out forwards;
  }
  @keyframes sparkOut {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-xl);
    padding: var(--spacing-xs) 0;
  }
  .nav-btn {
    width: 46px;
    height: 46px;
    border-radius: var(--radius-full);
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px var(--shadow-light);
  }
  .nav-btn svg { width: 20px; height: 20px; }
  .nav-btn:active { transform: scale(0.9); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:active { transform: none; }

  .mid-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 70px;
  }
  .counter {
    font-size: var(--font-sm);
    font-weight: 700;
    color: var(--text-secondary);
  }
  .shuffle-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: var(--text-tertiary);
    padding: 2px 8px;
    border-radius: var(--radius-full);
  }
  .shuffle-btn svg { width: 12px; height: 12px; }
  .shuffle-btn:active { transform: scale(0.92); }
  .shuffle-btn.spin svg { animation: spin 0.5s ease; }

  /* progress bar */
  .progress-track {
    height: 4px;
    border-radius: var(--radius-full);
    background: var(--bg-tertiary);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-primary);
    border-radius: var(--radius-full);
    transition: width 0.35s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    *, .card, .card-inner, .deck-shadow-card, .spark { animation: none !important; transition: none !important; }
  }

  @media (max-width: 360px) {
    .card-text { font-size: var(--font-md); }
    .controls { gap: var(--spacing-lg); }
  }
</style>
</head>
<body>

<div class="app">

  <div class="chips" id="chips" role="tablist" aria-label="Filter by topic"></div>

  <div class="stage" id="stage">
    <div class="deck-shadow-card ds-2"></div>
    <div class="deck-shadow-card ds-1"></div>
    <div class="card-perspective">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, tap to flip">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            <span class="card-topic-tag" id="topicTagFront"></span>
            <svg class="card-icon" id="iconFront" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
            <p class="card-text" id="frontText"></p>
            <span class="flip-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
              Tap to flip
            </span>
          </div>
          <div class="card-face card-back">
            <span class="card-topic-tag" id="topicTagBack"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <p class="card-text" id="backText"></p>
            <span class="flip-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
              Tap to flip back
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="mid-controls">
      <span class="counter" id="counter">1 / 1</span>
      <button class="shuffle-btn" id="shuffleBtn" aria-label="Shuffle cards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        Shuffle
      </button>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Next card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

</div>

<script>
/* =========================================================
   FLASHCARD DATA — edit / add cards here.
   Each card: { topic, front, back }
   ========================================================= */
window.FLASHCARDS = [
  // Sorting
  {
    topic: "Sorting",
    front: "Angel wants to arrange the names Yashika, Riyanshi and Aaradhya in A to Z order. Which feature should she use?",
    back: "Sort (A → Z) — puts names in alphabetical order."
  },
  {
    topic: "Sorting",
    front: "A teacher wants to arrange marks from highest to lowest. Which feature should be used?",
    back: "Sort (Largest → Smallest)."
  },
  {
    topic: "Sorting",
    front: "You want to arrange roll numbers from 1 to 40. Which feature should you use?",
    back: "Sort (Smallest → Largest)."
  },

  // Filtering
  {
    topic: "Filtering",
    front: "Purvi wants to see only students from the Ruby House in a list of 40 students. Which feature should she use?",
    back: "Filter — shows only the items you tick and temporarily hides everything else."
  },
  {
    topic: "Filtering",
    front: "A teacher wants to see only students who scored above 90 marks. Which feature should be used?",
    back: "Filter."
  },
  {
    topic: "Filtering",
    front: "You want to hide all absent students and see only present students. Which feature should you use?",
    back: "Filter."
  },

  // Conditional Formatting
  {
    topic: "Conditional Formatting",
    front: "A teacher wants marks above 90 to appear in green. Which feature should be used?",
    back: "Conditional Formatting."
  },
  {
    topic: "Conditional Formatting",
    front: "You want low marks to appear in red automatically. Which feature should you use?",
    back: "Conditional Formatting."
  },

  // Charts
  {
    topic: "Charts",
    front: "Which chart is best for comparing marks of different students?",
    back: "Bar Chart or Column Chart."
  },
  {
    topic: "Charts",
    front: "Which chart shows how the temperature changes every day?",
    back: "Line Chart."
  },
  {
    topic: "Charts",
    front: "Which chart shows what percentage of a family's money is spent on food, rent and travel?",
    back: "Pie Chart."
  },
  {
    topic: "Charts",
    front: "Which chart is best for comparing sales of different shops?",
    back: "Bar Chart."
  },
  {
    topic: "Charts",
    front: "Which chart is best for showing rainfall over several months?",
    back: "Line Chart."
  },

  // Consolidation
  {
    topic: "Consolidation",
    front: "You have marks in two different sheets and want to combine them into one sheet. Which feature should you use?",
    back: "Consolidation."
  },

  // Grouping
  {
    topic: "Grouping",
    front: "Dhanishth wants to edit many worksheets together at the same time. Which feature should he use to save time and make his work easier?",
    back: "Grouping."
  }
];

const TOPIC_META = {
  "All": {
    icon: '<path d="M4 6h16M4 12h16M4 18h10"/>'
  },
  "Sorting": {
    icon: '<path d="M3 6h6M3 12h10M3 18h14"/><path d="M17 4v12m0 0l-3-3m3 3l3-3"/>'
  },
  "Filtering": {
    icon: '<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>'
  },
  "Conditional Formatting": {
    icon: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>'
  },
  "Charts": {
    icon: '<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="12" y="7" width="3" height="11"/><rect x="17" y="13" width="3" height="5"/>'
  },
  "Consolidation": {
    icon: '<rect x="4" y="4" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/><path d="M11 8h2v5h5"/>'
  },
  "Grouping": {
    icon: '<rect x="3" y="5" width="18" height="4" rx="1"/><rect x="3" y="15" width="18" height="4" rx="1"/><path d="M12 9v6"/>'
  }
};

(function () {
  const cardsData = window.FLASHCARDS;
  const topics = ["All", ...Array.from(new Set(cardsData.map(c => c.topic)))];

  let activeTopic = "All";
  let order = [];
  let pos = 0;
  let isFlipped = false;
  let isAnimating = false;

  const chipsEl = document.getElementById("chips");
  const cardEl = document.getElementById("card");
  const cardInnerEl = document.getElementById("cardInner");
  const frontTextEl = document.getElementById("frontText");
  const backTextEl = document.getElementById("backText");
  const topicTagFront = document.getElementById("topicTagFront");
  const topicTagBack = document.getElementById("topicTagBack");
  const iconFront = document.getElementById("iconFront");
  const counterEl = document.getElementById("counter");
  const progressFill = document.getElementById("progressFill");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const stageEl = document.getElementById("stage");

  function currentDeck() {
    return activeTopic === "All" ? cardsData : cardsData.filter(c => c.topic === activeTopic);
  }

  function buildChips() {
    chipsEl.innerHTML = "";
    topics.forEach(topic => {
      const chip = document.createElement("button");
      chip.className = "chip" + (topic === activeTopic ? " active" : "");
      chip.setAttribute("role", "tab");
      chip.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${(TOPIC_META[topic] || TOPIC_META["All"]).icon}</svg><span>${topic}</span>`;
      chip.addEventListener("click", () => {
        if (topic === activeTopic) return;
        activeTopic = topic;
        order = shuffledIndices(currentDeck().length);
        pos = 0;
        isFlipped = false;
        buildChips();
        render(true);
      });
      chipsEl.appendChild(chip);
    });
  }

  function shuffledIndices(n) {
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function render(skipFlipReset) {
    const deck = currentDeck();
    if (!deck.length) return;
    const card = deck[order[pos]];

    cardEl.classList.remove("flipped");
    isFlipped = false;

    frontTextEl.textContent = card.front;
    backTextEl.textContent = card.back;

    const meta = TOPIC_META[card.topic] || TOPIC_META["All"];
    topicTagFront.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${meta.icon}</svg> ${card.topic}`;
    topicTagBack.innerHTML = topicTagFront.innerHTML;
    iconFront.innerHTML = meta.icon;

    counterEl.textContent = `${pos + 1} / ${deck.length}`;
    progressFill.style.width = `${((pos + 1) / deck.length) * 100}%`;

    prevBtn.disabled = deck.length <= 1 && pos === 0;
    nextBtn.disabled = deck.length <= 1 && pos === deck.length - 1;
  }

  function go(direction) {
    const deck = currentDeck();
    if (deck.length <= 1 || isAnimating) return;
    isAnimating = true;
    cardEl.classList.add(direction > 0 ? "sliding-left" : "sliding-right");
    setTimeout(() => {
      pos = (pos + direction + deck.length) % deck.length;
      cardEl.classList.remove("sliding-left", "sliding-right");
      render();
      isAnimating = false;
    }, 200);
  }

  function flip() {
    isFlipped = !isFlipped;
    cardEl.classList.toggle("flipped", isFlipped);
    burstSparks();
  }

  function burstSparks() {
    const rect = cardEl.getBoundingClientRect();
    const stageRect = stageEl.getBoundingClientRect();
    const cx = rect.left - stageRect.left + rect.width / 2;
    const cy = rect.top - stageRect.top + rect.height / 2;
    const count = 8;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const dist = 50 + Math.random() * 30;
      s.style.setProperty("--sx", `${Math.cos(angle) * dist}px`);
      s.style.setProperty("--sy", `${Math.sin(angle) * dist}px`);
      s.style.left = `${cx}px`;
      s.style.top = `${cy}px`;
      stageEl.appendChild(s);
      setTimeout(() => s.remove(), 650);
    }
  }

  cardEl.addEventListener("click", flip);
  cardEl.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  });

  prevBtn.addEventListener("click", () => go(-1));
  nextBtn.addEventListener("click", () => go(1));

  shuffleBtn.addEventListener("click", () => {
    order = shuffledIndices(currentDeck().length);
    pos = 0;
    shuffleBtn.classList.add("spin");
    setTimeout(() => shuffleBtn.classList.remove("spin"), 500);
    render(true);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  // swipe support
  let touchStartX = null;
  stageEl.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  stageEl.addEventListener("touchend", e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, { passive: true });

  // init
  order = shuffledIndices(cardsData.length === 0 ? 0 : currentDeck().length);
  buildChips();
  render(true);

  /* Called by the parent PWA whenever the theme is switched */
  window.toggleTheme = function () {
    document.body.classList.toggle("light-theme");
  };
})();
</script>

</body>
</html>
